name = "blipmail"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Set workers_dev to false when using your own domain
workers_dev = false

# ---- D1 Database ----
# Step 1: run `npx wrangler d1 create blipmail-db`
# Step 2: copy the database_id here
[[d1_databases]]
binding = "blipmail_db"
database_name = "blipmail-db"
database_id = "08f5c0f3-2601-456d-9a24-f4293f200f91"

# ---- Email Worker ----
[email]
action = "process"

# ---- Custom domain routes ----
# CHANGE THIS to your own domain (e.g. blipmail.example.com)
[[routes]]
pattern = "blipmail.mpruy.my.id"
custom_domain = true

# ---- Environment variables ----
# CHANGE THESE to your own domain
[vars]
APP_NAME = "BlipMail"
MAIL_DOMAIN = "mpruy.my.id"
WEB_HOST = "blipmail.mpruy.my.id"

# ---- Static assets (web frontend) ----
[assets]
directory = "./src/web"

# ---- Observability ----
[observability]
enabled = true
